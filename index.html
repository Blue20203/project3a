<!DOCTYPE html>
<html>
<head>
    <title>Stock Data Visualizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Stock Data Visualizer</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Choose Symbol</label>
        <select name="symbol" required>
            <option value="">--Select--</option>
            {% for s in symbols %}
            <option value="{{ s }}" {% if request.form.symbol == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>

        <label>Chart Type</label>
        <select name="chart_type" required>
            <option value="">--Select--</option>
            <option value="1">1. Bar</option>
            <option value="2">2. Line</option>
        </select>

        <label>Time Series</label>
        <select name="time_series" required>
            <option value="">--Select--</option>
            <option value="1">1. Intraday</option>
            <option value="2">2. Daily</option>
            <option value="3">3. Weekly</option>
            <option value="4">4. Monthly</option>
        </select>

        <label>Start Date</label>
        <input type="date" name="start_date" required>

        <label>End Date</label>
        <input type="date" name="end_date" required>

        <button type="submit">Submit</button>
    </form>

    {% if chart %}
    <div class="chart">
        <embed type="image/svg+xml" src="{{ chart|safe }}">
    </div>
    {% endif %}
</body>
</html>
